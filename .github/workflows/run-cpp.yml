
name: Run Fibonacci Programs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-cpp:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Compile programs
        run: |
          g++ -std=c++17 01_recursive.cpp -o recursive
          g++ -std=c++17 02_iterative.cpp -o iterative
          g++ -std=c++17 03_dynamic_programming.cpp -o dynamic
          g++ -std=c++17 04_loyalty_systems.cpp -o loyalty

      - name: Run recursive Fibonacci
        run: ./recursive

      - name: Run iterative Fibonacci
        run: ./iterative

      - name: Run dynamic programming Fibonacci
        run: ./dynamic

      - name: Run loyalty system
        run: printf "Jeremy Matata\n10\n" | ./loyalty
